# =============================================================================
# 发布管线 — Git Tag 触发自动发布到 PyPI + Docker Hub + GitHub Release
# =============================================================================
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write  # PyPI Trusted Publishing

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # 阶段 1: 验证 (复用 CI 的完整检查)
  # ---------------------------------------------------------------------------
  verify:
    name: 🔍 发布前验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: 安装 Python
        run: uv python install ${{ env.PYTHON_DEFAULT }}

      - name: 安装依赖
        run: uv sync --frozen

      - name: 运行完整测试
        run: uv run pytest tests/ -v --tb=short

      - name: 代码检查
        run: uv run ruff check .

  # ---------------------------------------------------------------------------
  # 阶段 2: 构建分发包
  # ---------------------------------------------------------------------------
  build:
    name: 📦 构建发布包
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: 安装 Python
        run: uv python install ${{ env.PYTHON_DEFAULT }}

      - name: 构建 wheel & sdist
        run: uv build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  # ---------------------------------------------------------------------------
  # 阶段 3: 发布到 PyPI (Trusted Publishing)
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: 🚀 发布到 PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nn-playground/
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------
  # 阶段 4: Docker 镜像发布
  # ---------------------------------------------------------------------------
  publish-docker:
    name: 🐳 发布 Docker 镜像
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 提取版本号
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 设置 QEMU (多架构)
        uses: docker/setup-qemu-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nn-playground:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nn-playground:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 阶段 5: GitHub Release
  # ---------------------------------------------------------------------------
  github-release:
    name: 📋 GitHub Release
    needs: [publish-pypi, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于生成变更日志

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: 生成变更日志
        id: changelog
        run: |
          # 获取上一个 tag 到当前 tag 的提交
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD~20..HEAD)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 🧠 NN Playground ${{ github.ref_name }}

            ### 📋 变更日志
            ${{ steps.changelog.outputs.CHANGES }}

            ### 📦 安装
            ```bash
            pip install nn-playground==${{ github.ref_name }}
            ```

            ### 🐳 Docker
            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nn-playground:${{ github.ref_name }}
            ```
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
