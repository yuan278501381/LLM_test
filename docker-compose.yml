# Docker Compose — 本地开发一键启动

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nn-playground
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_THEME_BASE=dark
    volumes:
      # 开发模式: 挂载源码实现热重载
      - ./nn_core:/app/nn_core:ro
      - ./datasets:/app/datasets:ro
      - ./dashboard:/app/dashboard:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M
          cpus: "0.5"
