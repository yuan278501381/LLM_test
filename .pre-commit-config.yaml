# Pre-commit hooks — 本地代码质量门禁
# 安装: uv run pre-commit install
# 手动运行: uv run pre-commit run --all-files
repos:
  # ---- Ruff: Lint + Format (替代 flake8/black/isort) ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        name: "🔍 Ruff Lint"
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: "🎨 Ruff Format"

  # ---- 通用文件检查 ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: "✂️ 尾部空白"
      - id: end-of-file-fixer
        name: "📄 文件末尾换行"
      - id: check-yaml
        name: "📋 YAML 语法"
      - id: check-toml
        name: "📋 TOML 语法"
      - id: check-added-large-files
        name: "📏 大文件检查"
        args: [--maxkb=500]
      - id: check-merge-conflict
        name: "🔀 合并冲突标记"
      - id: debug-statements
        name: "🐛 调试语句"

  # ---- 类型检查 ----
  - repo: https://github.com/RobertCraiworthy/pyright-python
    rev: v1.1.391
    hooks:
      - id: pyright
        name: "🏷️ Pyright 类型检查"
        additional_dependencies: [numpy, streamlit, plotly, scikit-learn]
        args: [nn_core/, datasets/]
